[mod]
id = "appleskin"
version = "1.1.0"
priority = 100

# Made with Horizon Translator's mod kit. It hooks only Horizon's native hook points (hooks API 68 in
# compatibility.json), so the launcher builds it on any Horizon that has them. The .hnmod names the commit it was
# made on.

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "kit_appleskin"
source = "runtime.rs"

[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "command"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_command"
helper = "command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "&mut *ran" },
]

[[injection]]
id = "settings"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings"
helper = "settings.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" },
]

[[injection]]
id = "click"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings_click"
helper = "click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]

[[injection]]
id = "health_hud"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_health_hud"
helper = "health_hud.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "inputs", ty = "&horizon_client::hud_layout::HealthInputs", value = "inputs" },
  { name = "wi", ty = "i32", value = "wi" },
  { name = "hi", ty = "i32", value = "hi" },
  { name = "draws", ty = "&mut Option<Vec<horizon_client::hud_layout::GuiDraw>>", value = "&mut *draws" },
]

[[injection]]
id = "tooltip_size"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_tooltip_component"
helper = "tooltip_size.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "stack", ty = "&horizon_client::items::ItemStack", value = "stack" },
  { name = "size", ty = "&mut Option<[f32; 2]>", value = "&mut *size" },
]

[[injection]]
id = "tooltip_draw"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_tooltip_component_draw"
helper = "tooltip_draw.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "stack", ty = "&horizon_client::items::ItemStack", value = "stack" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
  { name = "origin", ty = "[f32; 2]", value = "origin" },
]
