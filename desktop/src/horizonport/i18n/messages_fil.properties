# Best Shader Packs
shader.best.title=Pinakamahusay na mga shader pack
shader.best.desc=Mga pack na maayos na nagko-convert. Pindutin ang Download page, i-download ang bersyon ng Iris o OptiFine mula sa opisyal na pahina ng pack, pagkatapos ay pindutin ang Convert at piliin ang .zip na na-download mo. Nagko-convert ito sa iyong PC at napupunta sa folder ng shaderpacks ng Horizon. Ang mga mas bagong bersyon kaysa sa sinubukan ay karaniwang gumagana rin.
shader.best.disclaimer=Ang mga na-convert na pack ay para sa sarili mong paggamit: karamihan sa mga lisensya ng mga pack na ito ay hindi nagpapahintulot sa pagbabahagi ng mga binagong kopya, kaya huwag i-upload ang mga ito. Ang bawat pack ay pagmamay-ari ng may-akda nito; ang app na ito ay hindi kaakibat sa kanila.
