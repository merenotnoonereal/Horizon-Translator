# Experimental Notice
notice.experimental.title=实验性功能：请勿期望获得完全成品的模组。
notice.experimental.desc=模组转换器是一个移植辅助工具，而非一键移植工具。大多数模组转换后只能部分正常工作：任何基于 Horizon 尚未实现的 Minecraft 特性构建的内容都会被关闭，并在 PORTING.md 中列出以供您手动完善。只有完全转换成功的模组才会生成可即装即用的 .hnmod 文件。

