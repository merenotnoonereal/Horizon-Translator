kit.desc=మీ మోడ్ ఏమి చేస్తుందో ఎంచుకోండి, బాక్స్‌లను పూరించండి మరియు మోడ్ చేయండి నొక్కండి. మీరు ఇన్‌స్టాల్ చేయడానికి సిద్ధంగా ఉన్న .hnmod మరియు మోడ్ యొక్క Rust కోడ్‌ను పొందుతారు, మీరు మరింత ముందుకు వెళ్లాలనుకుంటే దాన్ని తర్వాత మార్చవచ్చు. మోడ్‌లు కొత్త Horizon వెర్షన్‌లలో కూడా పనిచేస్తాయి: అవి మోడ్స్ కోసం స్థిరంగా ఉంచబడిన గేమ్ భాగాలను మాత్రమే ఉపయోగిస్తాయి.
