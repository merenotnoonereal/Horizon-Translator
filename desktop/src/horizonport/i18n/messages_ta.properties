getmods.title=மோட்களைப் பெறுக
getmods.desc=இந்த ஆப்பின் மோட் கிட் மூலம் உருவாக்கப்பட்ட Horizon மோட்கள், விளையாடத் தயாராக உள்ளன. நிறுவு என்பது Horizon-ல் ஒன்றைச் சேர்க்கும்; பின்னர், Horizon லாஞ்சரில், மோட்களைத் திறந்து "Native build of Horizon" என்பதன் கீழ் Build என்பதை அழுத்தவும், பின்னர் அந்த பில்டை விளையாடுங்கள். ஒவ்வொரு மோடும் அதற்கு எந்த Horizon தேவை என்பதைக் குறிப்பிடுகிறது.
getmods.warning=நேட்டிவ் மோட்கள் உங்கள் உரிமைகளுடன் இயங்கும் மற்றும் சாண்ட்பாக்ஸ் செய்யப்படவில்லை. இவை இந்தத் திட்டத்தின் சொந்த மோட்கள், அவற்றின் மூலம் GitHub-ல் உள்ளது.
