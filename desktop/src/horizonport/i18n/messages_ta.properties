support.warning=ஒவ்வொரு முகவரியின் கீழும் பட்டியலிடப்பட்டுள்ள நெட்வொர்க்குகளில் மட்டுமே அனுப்பவும். மற்றொரு நெட்வொர்க்கில் அல்லது தவறாக தட்டச்சு செய்யப்பட்ட முகவரிக்கு அனுப்பப்பட்ட கிரிப்டோவை திரும்பப் பெற முடியாது. முகவரியைத் தட்டச்சு செய்வதற்குப் பதிலாக QR குறியீட்டை ஸ்கேன் செய்யவும் அல்லது முகவரியைத் தேர்ந்தெடுத்து Ctrl+C அழுத்தவும்.
