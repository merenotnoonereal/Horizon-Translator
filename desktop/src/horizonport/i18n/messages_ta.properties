shader.best.desc=நன்றாக மாறும் பேக்குகள். பதிவிறக்கப் பக்கத்தை அழுத்தி, பேக்கின் அதிகாரப்பூர்வ பக்கத்திலிருந்து Iris அல்லது OptiFine பதிப்பைப் பதிவிறக்கி, பின்னர் மாற்று என்பதை அழுத்தி பதிவிறக்கிய .zip-ஐத் தேர்ந்தெடுக்கவும். அது உங்கள் கணினியில் மாறி Horizon-ன் shaderpacks கோப்புறைக்குச் செல்லும். சோதிக்கப்பட்ட பதிப்பை விட புதிய பதிப்புகளும் பொதுவாகச் செயல்படும்.
shader.best.disclaimer=மாற்றப்பட்ட பேக்குகள் உங்கள் சொந்த பயன்பாட்டிற்கு மட்டுமே: இந்த பேக்குகளின் பெரும்பாலான உரிமங்கள் மாற்றியமைக்கப்பட்ட பிரதிகளைப் பகிர அனுமதிக்காது, எனவே அவற்றைப் பதிவேற்ற வேண்டாம். ஒவ்வொரு பேக்கும் அதன் ஆசிரியருக்கே உரியது; இந்த ஆப் அவர்களுடன் இணைக்கப்படவில்லை.
