notice.experimental.desc=மோட் கன்வெர்ட்டர் என்பது ஒரு உதவிக்கருவி மட்டுமே, ஒரே கிளிக்கில் போர்ட் செய்யும் கருவி அல்ல. பெரும்பாலான மோட்கள் பகுதியளவு மட்டுமே செயல்படும்: Horizon-ல் இதுவரை இல்லாத Minecraft அம்சங்களை அடிப்படையாகக் கொண்ட அனைத்தும் முடக்கப்பட்டு, நீங்கள் முடிப்பதற்காக PORTING.md-ல் பட்டியலிடப்படும். முழுமையாக மாற்றப்படும் மோட் மட்டுமே நிறுவத் தயாராக உள்ள .hnmod கோப்பாக வரும்.
