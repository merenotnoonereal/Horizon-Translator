kit.title=உங்கள் சொந்த Horizon மோடை உருவாக்குங்கள்
kit.desc=உங்கள் மோட் என்ன செய்கிறது என்பதைத் தேர்ந்தெடுத்து, பெட்டிகளை நிரப்பி, மோட் உருவாக்கு என்பதை அழுத்தவும். உங்களுக்கு நிறுவத் தயாராக உள்ள .hnmod மற்றும் மோடின் Rust குறியீடு கிடைக்கும், நீங்கள் தொடர விரும்பினால் பின்னர் அதை மாற்றலாம். புதிய Horizon பதிப்புகளிலும் மோட்கள் செயல்படும்: மோட்களுக்காக Horizon நிலையாக வைத்திருக்கும் விளையாட்டுப் பகுதிகளை மட்டுமே அவை பயன்படுத்துகின்றன.
