kit.desc=Pilih apa yang dilakukan mod kamu, isi kotak-kotaknya dan tekan Buat mod. Kamu mendapatkan file .hnmod yang siap dipasang dan kode Rust mod tersebut, yang dapat kamu ubah nanti jika ingin melangkah lebih jauh. Mod ini juga berfungsi pada versi Horizon yang lebih baru: mod hanya menggunakan bagian game yang dijaga stabil oleh Horizon untuk mod.
