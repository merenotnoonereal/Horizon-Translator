getmods.title=Dapatkan mod
getmods.desc=Mod Horizon yang dibuat dengan mod kit aplikasi ini, siap dimainkan. Instal akan menambahkan mod ke Horizon; kemudian, di peluncur Horizon, buka Mod dan tekan Build di bawah "Native build of Horizon", lalu mainkan build tersebut. Setiap mod menyebutkan Horizon mana yang dibutuhkannya.
getmods.warning=Mod native berjalan dengan hak akses kamu dan tidak di-sandbox. Ini adalah mod milik proyek ini sendiri, dengan sumber kodenya di GitHub.
