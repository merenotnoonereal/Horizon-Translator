shader.best.desc=Vifurushi vinavyobadilika vizuri. Bonyeza Ukurasa wa kupakua, pakua toleo la Iris au OptiFine kutoka ukurasa rasmi wa kifurushi, kisha bonyeza Badilisha na uchague faili ya .zip uliyopakua. Inabadilika kwenye PC yako na kwenda kwenye folda ya shaderpacks ya Horizon. Matoleo mapya zaidi kuliko yale yaliyojaribiwa kwa kawaida hufanya kazi pia.
