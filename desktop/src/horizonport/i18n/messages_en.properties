# Best Shader Packs
shader.best.title=Best shader packs
shader.best.desc=Packs that convert well. Press Download page, download the Iris or OptiFine version from the pack''s official page, then press Convert and pick the .zip you downloaded. It converts on your PC and goes into Horizon''s shaderpacks folder. Newer versions than the one tested usually work too.
shader.best.disclaimer=Converted packs are for your own use: most of these packs'' licences don''t allow sharing changed copies, so don''t upload them. Each pack belongs to its author; this app isn''t affiliated with them.
