# Experimental Notice
notice.experimental.title=Experimental: don''t expect a finished mod.
notice.experimental.desc=The mod converter is a helper, not a one-click port. Most mods come out only partly working: anything built on Minecraft features Horizon doesn''t have yet is switched off and listed in PORTING.md for you to finish. Only a mod that converts fully comes out as a ready-to-install .hnmod file.

