# Experimental Notice
notice.experimental.title=Experimentell: erwarte keine fertige Mod.
notice.experimental.desc=Der Mod-Konverter ist ein Hilfswerkzeug, keine 1-Klick-Portierung. Die meisten Mods funktionieren danach nur teilweise: Alles, was auf Minecraft-Funktionen aufbaut, die Horizon noch nicht hat, wird deaktiviert und in PORTING.md aufgelistet, damit du es fertigstellen kannst. Nur eine Mod, die sich vollständig konvertieren lässt, wird als fertige .hnmod-Datei ausgegeben.

