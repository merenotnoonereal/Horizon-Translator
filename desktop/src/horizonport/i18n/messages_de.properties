# Best Shader Packs
shader.best.title=Beste Shader-Pakete
shader.best.desc=Pakete, die sich gut konvertieren lassen. Klicke auf Download-Seite, lade die Iris- oder OptiFine-Version von der offiziellen Seite des Pakets herunter, klicke dann auf Konvertieren und wähle die heruntergeladene .zip aus. Sie wird auf deinem PC konvertiert und in Horizons shaderpacks-Ordner abgelegt. Neuere Versionen als die getestete funktionieren meist auch.
shader.best.disclaimer=Konvertierte Pakete sind für deinen eigenen Gebrauch bestimmt: Die meisten Lizenzen dieser Pakete erlauben keine Weitergabe modifizierter Kopien, lade sie also nicht hoch. Jedes Paket gehört seinem Autor; diese App steht in keiner Verbindung zu ihnen.
